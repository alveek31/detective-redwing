name: Test and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"    # refresh the window of case files
    - cron: "30 12 * * *"  # unseal yesterday's answers once that date has ended everywhere
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
        env:
          REDWING_SECRET: ${{ secrets.REDWING_SECRET }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
  # The answer desk: a Cloudflare Worker that hands out the answer after six wrong accusations.
  # Skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added as repository secrets.
  answer-desk:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CF == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.152.0"
          secrets: REDWING_SECRET
        env:
          REDWING_SECRET: ${{ secrets.REDWING_SECRET }}
